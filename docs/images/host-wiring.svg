<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img"><title>Хост · ESP32 и клапан</title><desc>Функциональная схема подключения • GPIO из src/host/Config.h • низковольтная DC-нагрузка</desc><rect width="1200" height="850" fill="#f4f7fb"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#172b45}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#52647a}.label{font-size:16px}.small{font-size:14px;fill:#52647a}.head{font-size:20px;font-weight:700}.pin{font-size:16px;font-weight:600}.wire{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><text x="45" y="55" class="title">Хост · ESP32 и клапан</text><text x="45" y="84" class="sub">Функциональная схема подключения • GPIO из src/host/Config.h • низковольтная DC-нагрузка</text><rect x="45" y="125" width="300" height="110" rx="16" fill="white" stroke="#d1dce8" stroke-width="2"/><text x="65" y="160" class="head">Источник питания DC</text><text x="65" y="186" class="small">Напряжение по номиналу нагрузки</text><text x="65" y="215" class="pin">+V нагрузки</text><text x="245" y="215" class="pin">GND</text><rect x="420" y="125" width="300" height="110" rx="16" fill="white" stroke="#d1dce8" stroke-width="2"/><text x="440" y="160" class="head">LM2596</text><text x="440" y="186" class="small">Настроить выход 5 V до подключения</text><text x="365" y="190" class="small">IN+</text><text x="440" y="225" class="pin">IN−</text><text x="610" y="215" class="pin">OUT 5 V</text><polyline points="345,170 420,170" class="wire" stroke="#db4d51"/><circle cx="345" cy="170" r="5" fill="#db4d51"/><circle cx="420" cy="170" r="5" fill="#db4d51"/><text x="355" y="157" class="small">+V</text><polyline points="345,215 385,215 385,230 420,230" class="wire" stroke="#52647a"/><circle cx="345" cy="215" r="5" fill="#52647a"/><circle cx="420" cy="230" r="5" fill="#52647a"/><rect x="45" y="335" width="300" height="235" rx="16" fill="white" stroke="#d1dce8" stroke-width="2"/><text x="65" y="370" class="head">ESP32</text><text x="65" y="396" class="small">DOIT DevKit V1</text><text x="225" y="430" class="pin">GPIO4</text><text x="248" y="500" class="pin">GND</text><text x="65" y="420" class="pin">VIN / 5V</text><text x="65" y="500" class="pin">GND</text><polyline points="660,235 660,285 95,285 95,335" class="wire" stroke="#db4d51"/><circle cx="660" cy="235" r="5" fill="#db4d51"/><circle cx="95" cy="335" r="5" fill="#db4d51"/><text x="215" y="273" class="small">5 V от преобразователя</text><polyline points="420,215 400,215 400,310 55,310 55,500" class="wire" stroke="#52647a"/><circle cx="420" cy="215" r="5" fill="#52647a"/><circle cx="55" cy="500" r="5" fill="#52647a"/><text x="66" y="302" class="small">OUT− → GND платы</text><rect x="510" y="335" width="300" height="235" rx="16" fill="white" stroke="#d1dce8" stroke-width="2"/><text x="530" y="370" class="head">MOSFET-модуль</text><text x="530" y="396" class="small">FR120N • логика 3,3 V</text><text x="530" y="430" class="pin">PWM / IN</text><text x="530" y="500" class="pin">GND сигнала</text><text x="700" y="430" class="pin">OUT</text><text x="530" y="550" class="pin">GND питания</text><text x="687" y="365" class="pin">+V</text><polyline points="345,430 510,430" class="wire" stroke="#397bd1"/><circle cx="345" cy="430" r="5" fill="#397bd1"/><circle cx="510" cy="430" r="5" fill="#397bd1"/><text x="371" y="414" class="small">управление</text><polyline points="345,500 510,500" class="wire" stroke="#52647a"/><circle cx="345" cy="500" r="5" fill="#52647a"/><circle cx="510" cy="500" r="5" fill="#52647a"/><text x="365" y="485" class="small">общая земля</text><polyline points="195,125 195,111 765,111 765,335" class="wire" stroke="#db4d51"/><circle cx="195" cy="125" r="5" fill="#db4d51"/><circle cx="765" cy="335" r="5" fill="#db4d51"/><text x="810" y="120" class="small">+V нагрузки</text><polyline points="510,550 475,550 475,625 20,625 20,250 360,250 360,215 345,215" class="wire" stroke="#52647a"/><circle cx="510" cy="550" r="5" fill="#52647a"/><circle cx="345" cy="215" r="5" fill="#52647a"/><rect x="910" y="335" width="245" height="235" rx="16" fill="white" stroke="#d1dce8" stroke-width="2"/><text x="930" y="370" class="head">Клапан / насос</text><text x="930" y="396" class="small">DC, внешнее питание</text><text x="930" y="420" class="pin">−</text><text x="930" y="530" class="pin">+</text><polyline points="810,430 865,430 865,420 910,420" class="wire" stroke="#1b9982"/><circle cx="810" cy="430" r="5" fill="#1b9982"/><circle cx="910" cy="420" r="5" fill="#1b9982"/><polyline points="765,335 765,300 1175,300 1175,530 1155,530" class="wire" stroke="#db4d51"/><circle cx="765" cy="335" r="5" fill="#db4d51"/><circle cx="1155" cy="530" r="5" fill="#db4d51"/><polyline points="865,430 1090,430 1090,460" class="wire" stroke="#1b9982"/><circle cx="865" cy="430" r="5" fill="#1b9982"/><circle cx="1090" cy="460" r="5" fill="#1b9982"/><polyline points="1090,490 1090,530 1155,530" class="wire" stroke="#db4d51"/><circle cx="1090" cy="490" r="5" fill="#db4d51"/><circle cx="1155" cy="530" r="5" fill="#db4d51"/><path d="M1078 460 L1102 460 L1090 482 Z M1078 488 H1102" fill="none" stroke="#172b45" stroke-width="2"/><text x="1015" y="485" class="small">D1</text><text x="900" y="280" class="small">D1 параллельно нагрузке</text><text x="860" y="590" class="small">Катод → +V; анод → OUT / «−» нагрузки</text><rect x="45" y="660" width="1110" height="151" rx="14" fill="#e9eff7"/><text x="65" y="690" class="small">Сигнальная и силовая земли соединены: ESP32 GND, LM2596 OUT−/IN− и GND драйвера.</text><text x="65" y="718" class="small">Диод: в исходной схеме 1N4007. Подберите его по току и режиму конкретной нагрузки.</text><text x="65" y="746" class="small">Насос и клапан не подключаются напрямую к GPIO. Номинал «+100V» на символе модуля — не питание системы.</text><text x="65" y="774" class="small">Если ESP32 питается от USB, не подключайте одновременно выход LM2596 к VIN без проверки схемы платы.</text></svg>