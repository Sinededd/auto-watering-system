<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img"><title>Датчик · ESP32-C3 и влажность почвы</title><desc>Функциональная схема подключения • GPIO из src/module_soilMoisture/Config.h</desc><rect width="1200" height="850" fill="#f4f7fb"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#172b45}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#52647a}.label{font-size:16px}.small{font-size:14px;fill:#52647a}.head{font-size:20px;font-weight:700}.pin{font-size:16px;font-weight:600}.wire{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><text x="45" y="55" class="title">Датчик · ESP32-C3 и влажность почвы</text><text x="45" y="84" class="sub">Функциональная схема подключения • GPIO из src/module_soilMoisture/Config.h</text><rect x="45" y="125" width="310" height="110" rx="16" fill="white" stroke="#d1dce8" stroke-width="2"/><text x="65" y="160" class="head">Питание ESP32-C3</text><text x="65" y="186" class="small">USB либо VIN по спецификации платы</text><text x="65" y="215" class="small">VIN: сверить напряжение питания</text><rect x="45" y="310" width="310" height="290" rx="16" fill="white" stroke="#d1dce8" stroke-width="2"/><text x="65" y="345" class="head">ESP32-C3 SuperMini</text><text x="240" y="410" class="pin">GPIO1</text><text x="230" y="480" class="pin">GPIO10</text><text x="65" y="565" class="pin">GPIO4</text><text x="250" y="565" class="pin">GND</text><text x="65" y="395" class="pin">3V3</text><polyline points="145,235 145,310" class="wire" stroke="#db4d51"/><circle cx="145" cy="235" r="5" fill="#db4d51"/><circle cx="145" cy="310" r="5" fill="#db4d51"/><rect x="560" y="310" width="250" height="160" rx="16" fill="white" stroke="#d1dce8" stroke-width="2"/><text x="580" y="345" class="head">Ключ питания Q1</text><text x="580" y="371" class="small">Верхний ключ линии VCC</text><text x="580" y="395" class="pin">IN 3,3 V</text><text x="580" y="450" class="pin">управление</text><text x="735" y="395" class="pin">OUT</text><polyline points="45,395 25,395 25,270 590,270 590,310" class="wire" stroke="#db4d51"/><circle cx="45" cy="395" r="5" fill="#db4d51"/><circle cx="590" cy="310" r="5" fill="#db4d51"/><text x="370" y="258" class="small">3,3 V</text><polyline points="355,480 460,480 460,450 560,450" class="wire" stroke="#397bd1"/><circle cx="355" cy="480" r="5" fill="#397bd1"/><circle cx="560" cy="450" r="5" fill="#397bd1"/><text x="370" y="508" class="small">HIGH = ON в коде</text><rect x="915" y="310" width="240" height="240" rx="16" fill="white" stroke="#d1dce8" stroke-width="2"/><text x="935" y="345" class="head">Датчик влажности</text><text x="935" y="371" class="small">Разъём: AOUT / VCC / GND</text><text x="935" y="405" class="pin">AOUT</text><text x="935" y="465" class="pin">VCC</text><text x="935" y="525" class="pin">GND</text><polyline points="355,410 410,410 410,290 875,290 875,405 915,405" class="wire" stroke="#1b9982"/><circle cx="355" cy="410" r="5" fill="#1b9982"/><circle cx="915" cy="405" r="5" fill="#1b9982"/><text x="600" y="279" class="small">Аналоговый сигнал → GPIO1</text><polyline points="810,395 850,395 850,465 915,465" class="wire" stroke="#db4d51"/><circle cx="810" cy="395" r="5" fill="#db4d51"/><circle cx="915" cy="465" r="5" fill="#db4d51"/><polyline points="355,565 880,565 880,525 915,525" class="wire" stroke="#52647a"/><circle cx="355" cy="565" r="5" fill="#52647a"/><circle cx="915" cy="525" r="5" fill="#52647a"/><text x="610" y="590" class="small">Общая земля</text><rect x="440" y="125" width="370" height="110" rx="16" fill="white" stroke="#d1dce8" stroke-width="2"/><text x="460" y="160" class="head">Кнопка настройки</text><text x="460" y="186" class="small">Нормально разомкнутая: GPIO4 ↔ GND</text><polyline points="45,565 15,565 15,255 460,255 460,235" class="wire" stroke="#397bd1"/><circle cx="45" cy="565" r="5" fill="#397bd1"/><circle cx="460" cy="235" r="5" fill="#397bd1"/><polyline points="780,235 780,250 1180,250 1180,615 325,615 325,600" class="wire" stroke="#52647a"/><circle cx="780" cy="235" r="5" fill="#52647a"/><circle cx="325" cy="600" r="5" fill="#52647a"/><text x="865" y="645" class="small">AOUT: не более 3,3 V</text><rect x="45" y="660" width="1110" height="151" rx="14" fill="#e9eff7"/><text x="65" y="690" class="small">GPIO10 управляет ключом. Прошивка: HIGH = ON, LOW = OFF. Проверьте полярность включения.</text><text x="65" y="718" class="small">В PDF у Q1 подтяжка 10 кОм к 3,3 V. Тип транзистора и его включение нужно сверить отдельно.</text><text x="65" y="746" class="small">Кнопка в исходном PDF подключена к GPIO3, в текущей прошивке — к GPIO4. Здесь показан GPIO4.</text><text x="65" y="774" class="small">Конденсатор C1 470 мкФ — между VIN и GND платы, с соблюдением полярности.</text></svg>